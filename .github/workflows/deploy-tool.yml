name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tool/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tool

      - name: Build Lehrer-Tool
        run: npm run build
        working-directory: tool

      - name: Assemble deployment directory
        run: |
          mkdir -p deploy/tool
          # Existing website files at root
          cp *.html deploy/ 2>/dev/null || true
          cp *.jpg *.png *.css *.js deploy/ 2>/dev/null || true
          # Static assets (design system CSS, logo, etc.)
          cp -r assets deploy/ 2>/dev/null || true
          # Lehrer-Tool built app into /tool/
          cp -r tool/dist/. deploy/tool/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
