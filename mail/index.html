<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulpost · Endlich Feierabend</title>
<meta name="description" content="Schulmail von unterwegs: lesen, antworten, senden. Läuft direkt gegen Microsoft Graph, ohne Zwischenserver.">
<meta name="theme-color" content="#0B2240">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/logo-mark.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Design-System „Dämmerung" — dieselben Rollen wie assets/ef.css */
:root{
  --ink:#0B2240; --ink-light:#0D3A6B; --ink-deep:#081A31;
  --gruen:#1A6B3C; --gruen-deep:#155A32; --gruen-tint:#E7F1EA;
  --amber:#CE8A2C; --amber-soft:#F6ECDB; --amber-text:#8A5A16;
  --rot:#CC1A1A; --rot-tint:#FBE9E9;
  --paper:#FAF7F1; --sand:#F1EBDF; --surface:#FFFFFF; --sunk:#FBF9F5;
  --text:#1B2430; --text-soft:#5A6573; --line:#E7DFCF; --line-soft:#F0E9DC;
  --on-dark:#EAF1F8; --on-dark-soft:rgba(234,241,248,.72);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:12px; --r-sm:8px; --r-pill:999px;
  --shadow:0 1px 2px rgba(11,34,64,.05), 0 8px 24px rgba(11,34,64,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#071628; --sand:#0C2340; --surface:#0E2742; --sunk:#0B1F36;
    --text:#E9F0F9; --text-soft:#9BB1CC; --line:#1D3D62; --line-soft:#16314F;
    --gruen:#1F7D46; --gruen-deep:#249152; --gruen-tint:#102C1D;
    --amber:#E2A94F; --amber-soft:#2B2211; --amber-text:#E2A94F;
    --rot:#FF7A7A; --rot-tint:#33161A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --paper:#071628; --sand:#0C2340; --surface:#0E2742; --sunk:#0B1F36;
  --text:#E9F0F9; --text-soft:#9BB1CC; --line:#1D3D62; --line-soft:#16314F;
  --gruen:#1F7D46; --gruen-deep:#249152; --gruen-tint:#102C1D;
  --amber:#E2A94F; --amber-soft:#2B2211; --amber-text:#E2A94F;
  --rot:#FF7A7A; --rot-tint:#33161A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  background:var(--paper); color:var(--text); font-family:var(--body); font-size:15.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
}
h1,h2,h3{font-family:var(--display); font-weight:800; letter-spacing:-.02em; line-height:1.1; margin:0; text-wrap:balance}
button{font-family:inherit; font-size:inherit}
a{color:var(--ink-light)}
:root[data-theme="dark"] a{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:var(--amber)}}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important}}

/* Kopfzeile */
.top{
  position:sticky; top:0; z-index:20; background:var(--ink); color:var(--on-dark);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  display:flex; align-items:center; gap:10px;
}
.top__logo{width:26px; height:24px; flex:none}
.top__t{font-family:var(--display); font-weight:800; font-size:16.5px; letter-spacing:-.02em}
.top__sp{flex:1}
.top__acc{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; color:var(--on-dark-soft);
  max-width:44vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.iconbtn{
  background:rgba(255,255,255,.09); border:0; color:var(--on-dark); width:32px; height:32px;
  border-radius:var(--r-sm); cursor:pointer; display:grid; place-items:center; flex:none; font-size:15px;
}
.iconbtn:hover{background:rgba(255,255,255,.16)}

.wrap{max-width:760px; margin:0 auto; padding:16px 14px calc(96px + var(--safe-b))}
.eyebrow{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--text-soft)}
.lede{color:var(--text-soft); margin:7px 0 0}
.small{font-size:12.5px; color:var(--text-soft)}
.mono{font-family:var(--mono)}
.hide{display:none!important}
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; gap:9px; align-items:center; flex-wrap:wrap}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card--pad{padding:16px 17px}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:11px 17px;
  border-radius:var(--r-sm); background:var(--gruen); color:#fff; border:1px solid var(--gruen);
  font-weight:600; cursor:pointer; min-height:44px;
}
.btn:hover:not(:disabled){background:var(--gruen-deep); border-color:var(--gruen-deep)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn--ghost{background:transparent; color:var(--text); border-color:var(--line)}
.btn--ghost:hover:not(:disabled){background:var(--sand); border-color:var(--text-soft)}
.btn--sm{padding:7px 12px; font-size:13.5px; min-height:36px}
.btn--danger{background:transparent; color:var(--rot); border-color:var(--line)}
.btn--block{width:100%}

input,select,textarea{
  font-family:inherit; font-size:16px; /* 16px verhindert Auto-Zoom auf iOS */
  color:var(--text); background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:10px 12px; width:100%; min-width:0;
}
textarea{line-height:1.6; resize:vertical}
label.fld{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--text-soft)}
label.fld > input, label.fld > select, label.fld > textarea{font-weight:400; color:var(--text)}
.switch{display:flex; align-items:flex-start; gap:9px; font-size:13.5px; color:var(--text); cursor:pointer; line-height:1.5}
.switch input{width:18px; height:18px; accent-color:var(--gruen); margin:2px 0 0; flex:none; width:18px}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:var(--r-pill);
  background:var(--sand); color:var(--text-soft); white-space:nowrap;
}
.chip[data-tone="ink"]{background:var(--ink); color:#fff}
.chip[data-tone="amber"]{background:var(--amber-soft); color:var(--amber-text)}
.chip[data-tone="gruen"]{background:var(--gruen-tint); color:var(--gruen)}
.chip[data-tone="rot"]{background:var(--rot-tint); color:var(--rot)}

.note{border-radius:var(--r); padding:13px 15px; font-size:13.5px; line-height:1.6; display:flex; gap:11px; align-items:flex-start}
.note__b{font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; flex:none; padding-top:3px}
.note[data-k="info"]{background:var(--sand); border:1px solid var(--line)}
.note[data-k="info"] .note__b{color:var(--text-soft)}
.note[data-k="warn"]{background:var(--rot-tint); border:1px solid var(--rot)}
.note[data-k="warn"] .note__b{color:var(--rot)}
.note[data-k="law"]{background:var(--amber-soft); border:1px solid var(--amber)}
.note[data-k="law"] .note__b{color:var(--amber-text)}
.note code{font-family:var(--mono); font-size:12px; background:rgba(0,0,0,.06); padding:1px 4px; border-radius:4px; overflow-wrap:anywhere}
:root[data-theme="dark"] .note code{background:rgba(255,255,255,.1)}

/* Postfach-Umschalter */
.tabs{display:flex; gap:5px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch}
.tabs button{
  white-space:nowrap; background:var(--surface); border:1px solid var(--line); color:var(--text-soft);
  padding:7px 13px; border-radius:var(--r-pill); cursor:pointer; font-size:13.5px; font-weight:600; min-height:36px;
}
.tabs button[aria-current="true"]{background:var(--ink); border-color:var(--ink); color:#fff}

/* Liste */
.list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.mail{
  display:flex; gap:11px; padding:13px 14px; border-top:1px solid var(--line-soft); text-align:left;
  background:none; border-left:0; border-right:0; border-bottom:0; width:100%; color:inherit; font:inherit; cursor:pointer;
  align-items:flex-start;
}
.mail:first-child{border-top:0}
.mail:hover{background:var(--sunk)}
.mail[data-unread="1"]{border-left:3px solid var(--amber); padding-left:11px}
.mail__m{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.mail__f{font-family:var(--mono); font-size:11.5px; color:var(--text-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mail__s{font-weight:600; line-height:1.35; overflow-wrap:anywhere}
.mail[data-unread="0"] .mail__s{font-weight:500}
.mail__p{font-size:13px; color:var(--text-soft); line-height:1.45; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.mail__d{font-family:var(--mono); font-size:10.5px; color:var(--text-soft); flex:none; padding-top:2px; text-align:right}

.empty{padding:26px 18px; text-align:center; color:var(--text-soft); font-size:13.5px;
  background:var(--sunk); border:1px dashed var(--line); border-radius:var(--r)}
.skel{height:13px; border-radius:6px; background:var(--sand); animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.95}}

/* Lesen */
.body-text{
  white-space:pre-wrap; overflow-wrap:anywhere; font-size:14.5px; line-height:1.68; margin:0;
  background:var(--sunk); border:1px solid var(--line-soft); border-radius:var(--r-sm); padding:13px 14px;
  max-height:52vh; overflow-y:auto; font-family:var(--body);
}
iframe.body-html{
  width:100%; height:52vh; border:1px solid var(--line-soft); border-radius:var(--r-sm);
  background:#fff; display:block;
}
.metaline{display:flex; gap:9px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--text-soft)}

/* Fußleiste mit Aktionen */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface);
  border-top:1px solid var(--line); padding:10px 12px calc(10px + var(--safe-b));
  display:flex; gap:8px; box-shadow:0 -4px 18px rgba(11,34,64,.07);
}
.bar .btn{flex:1}
.fab{
  position:fixed; right:16px; bottom:calc(78px + var(--safe-b)); z-index:24;
  width:54px; height:54px; border-radius:50%; background:var(--gruen); color:#fff; border:0;
  font-size:24px; line-height:1; cursor:pointer; box-shadow:0 6px 20px rgba(11,34,64,.28);
  display:grid; place-items:center;
}

.spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(88px + var(--safe-b)); z-index:40;
  background:var(--ink-deep); color:var(--on-dark); padding:11px 16px; border-radius:var(--r-pill);
  font-size:13.5px; box-shadow:var(--shadow); max-width:90vw; text-align:center;
}
.toast[data-k="bad"]{background:var(--rot); color:#fff}
</style>
</head>
<body>

<header class="top">
  <svg class="top__logo" viewBox="0 0 48 44" aria-hidden="true">
    <clipPath id="hz"><rect x="0" y="0" width="48" height="29"></rect></clipPath>
    <circle cx="24" cy="29" r="12.5" fill="#CE8A2C" clip-path="url(#hz)"></circle>
    <line x1="4" y1="29" x2="44" y2="29" stroke="#EAF1F8" stroke-width="3.2" stroke-linecap="round"></line>
    <line x1="13" y1="36" x2="35" y2="36" stroke="#EAF1F8" stroke-width="3.2" stroke-linecap="round" opacity="0.4"></line>
  </svg>
  <span class="top__t">Schulpost</span>
  <span class="top__sp"></span>
  <span class="top__acc" id="acc"></span>
  <button class="iconbtn" id="btnReload" title="Neu laden" aria-label="Neu laden">&#8635;</button>
  <button class="iconbtn" id="btnSet" title="Einstellungen" aria-label="Einstellungen">&#9881;</button>
</header>

<main class="wrap" id="app">
  <div class="stack">
    <div class="skel" style="width:45%"></div>
    <div class="skel" style="width:80%"></div>
    <div class="skel" style="width:62%"></div>
  </div>
</main>

<script src="vendor/msal-browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
